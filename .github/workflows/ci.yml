name: Sharyoof V2 - Test First and Deploy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-v2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  site-core:
    name: Site Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
  site-release:
    name: Site Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Assert independent production target
        run: |
          grep -qx 'name = "sharyoof-v2"' wrangler.toml
          grep -qx 'database_name = "sharyoof-portal-v2-db"' wrangler.toml
          grep -qx 'keep_vars = true' wrangler.toml
          if grep -R -n -E 'cfut_|-----BEGIN .*PRIVATE KEY-----' src public wrangler.toml scripts; then
            echo '::error::Credentials must not be hardcoded into source'; exit 1
          fi
  deploy:
    name: Deploy New Cloudflare Worker
    needs: [site-core,site-release]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Check required Cloudflare secrets
        env:
          API_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          PASSWORD_PRESENT: ${{ secrets.PORTAL_ADMIN_PASSWORD != '' }}
        run: |
          test "$API_PRESENT" = true || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test "$ACCOUNT_PRESENT" = true || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test "$PASSWORD_PRESENT" = true || { echo '::error::Missing PORTAL_ADMIN_PASSWORD'; exit 1; }
      - name: Provision separate D1 database and config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision.mjs
      - name: Apply new database migration (never the legacy DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply sharyoof-portal-v2-db --remote --config wrangler.generated.toml
      - name: Deploy independent Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.generated.toml
      - name: Configure admin login secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PORTAL_ADMIN_PASSWORD: ${{ secrets.PORTAL_ADMIN_PASSWORD }}
        shell: bash
        run: |
          test "${#PORTAL_ADMIN_PASSWORD}" -ge 12 || { echo '::error::Admin password must be at least 12 characters'; exit 1; }
          printf '%s' "$PORTAL_ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD --config wrangler.generated.toml
