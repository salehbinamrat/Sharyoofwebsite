# NEW portal only. Do not change or delete the existing sharyoof Worker.
name = "sharyoof-v2"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "sharyoof-portal-v2-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
